name: Publish Release

on:
  push:
    branches: [main]

concurrency:
  group: publish-release-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  qualify:
    name: Qualify release merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_publish: ${{ steps.pr.outputs.should_publish }}
      version: ${{ steps.pr.outputs.version }}
      tag: ${{ steps.pr.outputs.tag }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")

          match=$(printf '%s' "$prs" | jq -c --arg sha "$GITHUB_SHA" '
            [
              .[]
              | select(.merge_commit_sha == $sha)
              | select(.base.ref == "main")
              | select(.head.ref | startswith("release/"))
              | select([.labels[].name] | index("release"))
            ]
            | first // empty
          ')

          if [ -z "$match" ]; then
            echo "No merged release PR is associated with ${GITHUB_SHA}; skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_ref=$(printf '%s' "$match" | jq -r '.head.ref')
          pr_number=$(printf '%s' "$match" | jq -r '.number')
          tag="${head_ref#release/}"
          version="${tag#v}"

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release branch '${head_ref}' must be named release/vMAJOR.MINOR.PATCH."
            exit 1
          fi

          {
            echo "should_publish=true"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "pr_number=${pr_number}"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Validate release version
    needs: qualify
    if: needs.qualify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Validate version files
        run: |
          set -euo pipefail
          version="${{ needs.qualify.outputs.version }}"

          cargo_toml_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          cargo_lock_version=$(perl -0ne 'print "$1\n" if /\[\[package\]\]\nname = "rusty-template"\nversion = "([^"]+)"/' Cargo.lock)
          package_version=$(node -p 'require("./ui/package.json").version')
          package_lock_version=$(node -p 'require("./ui/package-lock.json").version')
          package_lock_root_version=$(node -p 'require("./ui/package-lock.json").packages[""].version')

          for actual in "$cargo_toml_version" "$cargo_lock_version" "$package_version" "$package_lock_version" "$package_lock_root_version"; do
            if [ "$actual" != "$version" ]; then
              echo "::error::Version files disagree. Expected ${version}, found ${actual}."
              exit 1
            fi
          done

          cargo test --locked --no-run
          npm ci --ignore-scripts --prefix ui

  build:
    name: Build / ${{ matrix.target }}
    needs: [qualify, validate]
    if: needs.qualify.outputs.should_publish == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - working-directory: ui
        run: |
          npm ci --ignore-scripts
          npm run build

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          stage="rusty-template-${{ needs.qualify.outputs.tag }}-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/rusty-template" "$stage/"
          cp README.md LICENSE config.toml "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          shasum -a 256 "$stage.tar.gz" > "$stage.tar.gz.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "rusty-template-${{ needs.qualify.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rusty-template.exe" -Destination $stage
          Copy-Item README.md, LICENSE, config.toml -Destination $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Get-FileHash "$stage.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $stage.zip" } |
            Out-File -Encoding ascii "$stage.zip.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.target }}
          path: |
            rusty-template-*.tar.gz
            rusty-template-*.tar.gz.sha256
            rusty-template-*.zip
            rusty-template-*.zip.sha256
          if-no-files-found: error

  tag:
    name: Create release tag
    needs: [qualify, validate, build]
    if: needs.qualify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Create or verify annotated tag
        run: |
          set -euo pipefail
          tag="${{ needs.qualify.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "${tag}" >/dev/null 2>&1; then
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            tagged_sha=$(git rev-list -n 1 "${tag}")
            if [ "$tagged_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${tag} already exists at ${tagged_sha}, not ${GITHUB_SHA}."
              exit 1
            fi
            echo "Tag ${tag} already points to ${GITHUB_SHA}; continuing rerun."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"

  release:
    name: Publish GitHub Release
    needs: [qualify, build, tag]
    if: needs.qualify.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.qualify.outputs.tag }}
          name: ${{ needs.qualify.outputs.tag }}
          generate_release_notes: true
          files: dist/*
